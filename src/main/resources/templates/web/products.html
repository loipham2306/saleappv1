<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h1>TẤT CẢ SẢN PHẨM</h1>
    <form th:action="@{/products}" method="get" style="margin: 20px 0;">
    <input type="text" name="keyword" placeholder="Nhập tên sản phẩm...">
    <input type="number" name="fromPrice" placeholder="Giá từ (VNĐ)...">
    <input type="number" name="toPrice" placeholder="Đến giá (VNĐ)...">
    <button type="submit">Tìm kiếm</button>
</form>
    <a th:href="@{/}">Về trang chủ</a>
    
    <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
        <!-- Lặp qua danh sách sản phẩm -->
        <!-- Lặp qua danh sách sản phẩm -->
        <div th:each="p : ${products}" style="border: 1px solid #ccc; padding: 15px; width: 250px;">
            <!-- Tạo link bấm vào để sang trang chi tiết (truyền ID động) -->
            <a th:href="@{/products/{id}(id=${p.id})}" style="text-decoration: none; color: inherit;">
                <img th:src="@{'/images/' + ${p.image}}" alt="Hình ảnh sản phẩm" style="width: 100%; height: 200px; object-fit: cover;">
                <h3 th:text="${p.name}">Tên sản phẩm</h3>
                <p th:text="${p.description}">Mô tả</p>
                <p style="color: red; font-weight: bold;" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'">Giá</p>
            </a>
        </div>
    </div>
</body>
</html>
